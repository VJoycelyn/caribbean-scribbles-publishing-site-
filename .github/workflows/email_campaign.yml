name: Weekly Book Recommendation Email Campaign

on:
  # Mon, Wed, Fri at 9 AM, 12 PM, 6 PM UTC
  schedule:
    - cron: '0 9 * * 1'   # Monday 9 AM UTC
    - cron: '0 12 * * 1'  # Monday 12 PM UTC
    - cron: '0 18 * * 1'  # Monday 6 PM UTC
    - cron: '0 9 * * 3'   # Wednesday 9 AM UTC
    - cron: '0 12 * * 3'  # Wednesday 12 PM UTC
    - cron: '0 18 * * 3'  # Wednesday 6 PM UTC
    - cron: '0 9 * * 5'   # Friday 9 AM UTC
    - cron: '0 12 * * 5'  # Friday 12 PM UTC
    - cron: '0 18 * * 5'  # Friday 6 PM UTC

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-email-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run email campaign
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: |
          cd scripts
          python send_campaign.py
