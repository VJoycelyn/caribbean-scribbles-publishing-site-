<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Page not found — Caribbean Scribbles Publishing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2300b4d8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230077b6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-size%3D%2227%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3ECS%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta name="theme-color" content="#007b83" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style>
    :root {
      --primary: #007b83;
      --primary-dark: #005962;
      --accent: #ffc857;
      --bg: #f5f7fb;
      --text: #222;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
      text-align: center;
    }
    .wrap { max-width: 560px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      border-radius: 20px;
      background: radial-gradient(circle at 10% 0%, #00b4d8, #0077b6);
      color: #fff; font-weight: 800; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      letter-spacing: 0.5px;
    }
    .code {
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--primary);
      margin-bottom: 0.75rem;
    }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.25; margin-bottom: 0.85rem; }
    p { color: var(--muted); margin-bottom: 1.75rem; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px;
      font-weight: 600; text-decoration: none; font-size: 0.95rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 10px 22px rgba(0,123,131,0.28); }
    .btn-outline { background: #fff; color: var(--primary-dark); border: 1.5px solid #d8dee9; }
    .btn:hover { transform: translateY(-2px); }
    footer { margin-top: 2.5rem; font-size: 0.78rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">CS</div>
    <div class="code">Error 404</div>
    <h1>This page drifted off to another island</h1>
    <p>
      The page you're looking for isn't here. It may have moved, or the link may have a
      small typo. Let's get you back to the stories.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to homepage</a>
      <a class="btn btn-outline" href="/#books">Browse our books</a>
      <a class="btn btn-outline" href="/#contact">Contact us</a>
    </div>
    <footer>© <span id="year">2026</span> Caribbean Scribbles Publishing. All rights reserved.</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
